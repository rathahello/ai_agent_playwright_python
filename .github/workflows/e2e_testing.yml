name: Playwright E2E Tests

on:
  push:
    branches: [ demo-system, main ]
  pull_request:
    branches: [ demo-system, main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: playwright install --with-deps chromium

      - name: Run Tests
        run: pytest --slowmo 0

      - name: Upload Test Report & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-reports
          path: reports/
          retention-days: 14

      - name: Send Telegram Notification
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "Telegram credentials not configured. Skipping notification."
            exit 0
          fi

          if [ "${{ job.status }}" = "success" ]; then
            STATUS="✅ PASSED"
          else
            STATUS="❌ FAILED"
          fi

          MESSAGE="<b>Playwright E2E Tests: ${STATUS}</b>%0A%0A"
          MESSAGE+="• <b>Repository:</b> ${{ github.repository }}%0A"
          MESSAGE+="• <b>Branch:</b> ${{ github.ref_name }}%0A"
          MESSAGE+="• <b>Triggered by:</b> ${{ github.actor }}%0A"
          MESSAGE+="• <b>Commit:</b> <code>${{ github.sha }}</code>%0A"
          MESSAGE+="• <b>Run Details:</b> <a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View Actions Log</a>"

          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            -d "text=${MESSAGE}"